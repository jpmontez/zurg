services:
  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: zurg
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./config.yml:/app/config.yml
      - zurgdata:/app/data
    environment:
      - ZURG_TOKEN=${RD_TOKEN}

volumes:
  zurgdata:
